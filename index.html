<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guided Dialogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel">
    const scenarios = [
      {
        id: "meeting",
        label: "İlk Tanışma",
        steps: [
          "Merhaba! Bugün tanışma görüşmesi için buradayım. Bana kısaca kendinden bahseder misin?",
          "Teşekkürler! Şu anda seni en çok motive eden şey nedir?",
          "Harika. Bu görüşmeden beklentin nedir?"
        ]
      },
      {
        id: "support",
        label: "Destek Talebi",
        steps: [
          "Merhaba! Hangi konuda destek almak istiyorsun?",
          "Anladım. Bu konuda şimdiye kadar neler denedin?",
          "Tamam. Sana nasıl bir çözüm en çok yardımcı olurdu?"
        ]
      },
      {
        id: "feedback",
        label: "Geri Bildirim",
        steps: [
          "Merhaba! Son deneyimini nasıl özetlersin?",
          "Peki, seni en çok zorlayan nokta neydi?",
          "Teşekkürler. Bir sonraki adımda ne görmek isterdin?"
        ]
      }
    ];

    function App() {
      const [selectedScenario, setSelectedScenario] = React.useState("");
      const [messages, setMessages] = React.useState([]);
      const [stepIndex, setStepIndex] = React.useState(0);
      const [inputValue, setInputValue] = React.useState("");

      const scenario = scenarios.find((item) => item.id === selectedScenario);

      const handleScenarioChange = (event) => {
        const value = event.target.value;
        setSelectedScenario(value);
        setInputValue("");
        if (value) {
          const firstStep = scenarios.find((item) => item.id === value).steps[0];
          setMessages([
            {
              id: "system-0",
              role: "system",
              text: firstStep
            }
          ]);
          setStepIndex(0);
        } else {
          setMessages([]);
          setStepIndex(0);
        }
      };

      const handleSubmit = (event) => {
        event.preventDefault();
        if (!inputValue.trim() || !scenario) {
          return;
        }

        const nextMessages = [
          ...messages,
          {
            id: `user-${Date.now()}`,
            role: "user",
            text: inputValue.trim()
          }
        ];

        const nextStepIndex = stepIndex + 1;
        if (scenario.steps[nextStepIndex]) {
          nextMessages.push({
            id: `system-${nextStepIndex}`,
            role: "system",
            text: scenario.steps[nextStepIndex]
          });
        }

        setMessages(nextMessages);
        setStepIndex(nextStepIndex);
        setInputValue("");
      };

      const isChatDisabled = !scenario;
      const isCompleted = scenario && stepIndex >= scenario.steps.length;

      return (
        <div className="mx-auto flex min-h-screen max-w-3xl flex-col gap-6 px-6 py-10">
          <header className="rounded-2xl bg-white p-6 shadow-sm">
            <h1 className="text-2xl font-semibold text-slate-800">Guided Dialogue</h1>
            <p className="mt-2 text-sm text-slate-600">
              Bir senaryo seç ve yönlendirilmiş diyalog akışını başlat.
            </p>
          </header>

          <section className="rounded-2xl bg-white p-6 shadow-sm">
            <label className="text-sm font-medium text-slate-700">Senaryo seçimi</label>
            <select
              value={selectedScenario}
              onChange={handleScenarioChange}
              className="mt-2 w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-200"
            >
              <option value="">Senaryo seçiniz</option>
              {scenarios.map((item) => (
                <option key={item.id} value={item.id}>
                  {item.label}
                </option>
              ))}
            </select>
          </section>

          <section className="flex flex-1 flex-col rounded-2xl bg-white p-6 shadow-sm">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-semibold text-slate-800">Diyalog Akışı</h2>
              {scenario ? (
                <span className="rounded-full bg-violet-100 px-3 py-1 text-xs font-medium text-violet-700">
                  {scenario.label}
                </span>
              ) : (
                <span className="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-500">
                  Senaryo seçilmedi
                </span>
              )}
            </div>

            <div className="mt-4 flex-1 space-y-3 overflow-y-auto rounded-xl border border-dashed border-slate-200 bg-slate-50 p-4">
              {messages.length === 0 ? (
                <div className="text-sm text-slate-500">
                  Chat başlamadan önce bir senaryo seçmelisin.
                </div>
              ) : (
                messages.map((message) => (
                  <div
                    key={message.id}
                    className={
                      message.role === "system"
                        ? "rounded-xl bg-white px-4 py-3 text-sm text-slate-700 shadow-sm"
                        : "ml-auto max-w-[75%] rounded-xl bg-violet-600 px-4 py-3 text-sm text-white shadow-sm"
                    }
                  >
                    <p className="font-medium">
                      {message.role === "system" ? "Sistem" : "Sen"}
                    </p>
                    <p className="mt-1">{message.text}</p>
                  </div>
                ))
              )}
            </div>

            <form onSubmit={handleSubmit} className="mt-4 flex flex-col gap-3">
              <textarea
                value={inputValue}
                onChange={(event) => setInputValue(event.target.value)}
                placeholder={
                  isChatDisabled
                    ? "Önce bir senaryo seçmelisin"
                    : isCompleted
                    ? "Diyalog tamamlandı"
                    : "Cevabını yaz..."
                }
                disabled={isChatDisabled || isCompleted}
                rows="3"
                className="w-full resize-none rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 focus:border-violet-400 focus:outline-none focus:ring-2 focus:ring-violet-200 disabled:bg-slate-100"
              ></textarea>
              <button
                type="submit"
                disabled={isChatDisabled || isCompleted || !inputValue.trim()}
                className="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-violet-700 disabled:cursor-not-allowed disabled:bg-slate-300"
              >
                {isCompleted ? "Tamamlandı" : "Gönder"}
              </button>
            </form>

            {scenario && (
              <p className="mt-4 text-xs text-slate-500">
                Adım {Math.min(stepIndex + 1, scenario.steps.length)} / {scenario.steps.length}
              </p>
            )}
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
